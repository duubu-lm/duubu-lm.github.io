<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Hire Onboarding — Welcome to the Team</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #080808;
      --card-bg: #0e0e10;
      --primary: #c9a84c;
      --primary-lt: #e8c97a;
      --text:    #f0ece4;
      --muted:   #7a7a72;
      --card:    #111110;
      --border:  rgba(201, 168, 76, 0.14);
      --shadow:  0 4px 32px rgba(0, 0, 0, 0.6);
      --serif:   'Cormorant Garamond', Georgia, serif;
      --sans:    'DM Sans', sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.7;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Page shell ── */
    .shell {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.5s ease both;
    }

    /* ── Gold top strip ── */
    .top-strip {
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--primary), var(--primary-lt), var(--primary));
      flex-shrink: 0;
    }

    /* ── Header ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      box-shadow: 0 1px 10px rgba(0,0,0,0.4);
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--muted);
      font-size: 0.84rem;
      letter-spacing: 0.02em;
      transition: color 0.2s ease;
    }
    .back-link:hover { color: var(--primary); }
    .back-link svg { width: 15px; height: 15px; flex-shrink: 0; }

    .org-brand {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }
    .org-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--serif);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary);
      letter-spacing: 0.04em;
    }
    .org-icon { font-size: 1.1rem; font-family: var(--sans); }
    .org-tagline {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 44px 20px 60px;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      margin-bottom: 30px;
      animation: fadeIn 0.5s 0.1s ease both;
    }
    .hero-eyebrow {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 10px;
    }
    .hero h1 {
      font-family: var(--serif);
      font-size: clamp(1.9rem, 4vw, 2.8rem);
      font-weight: 600;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 10px;
    }
    .hero h1 em {
      font-style: italic;
      color: var(--primary-lt);
    }
    .hero-sub {
      font-size: 0.9rem;
      color: var(--muted);
      max-width: 460px;
      margin: 0 auto;
      line-height: 1.7;
    }
    .divider {
      width: 44px;
      height: 2px;
      background: linear-gradient(90deg, var(--primary), var(--primary-lt));
      border-radius: 999px;
      margin: 12px auto 0;
    }

    /* ── Form card ── */
    .form-card {
      width: 100%;
      max-width: 620px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      border-top: 3px solid var(--primary);
      overflow: hidden;
      animation: fadeIn 0.5s 0.18s ease both;
    }

    .form-card iframe {
      display: block;
      width: 100%;
      height: 860px;
      border: none;
    }

    /* ── Trust signals ── */
    .trust {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 26px;
      animation: fadeIn 0.5s 0.28s ease both;
    }
    .trust-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .trust-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--primary);
      color: #080808;
      font-size: 0.6rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ── Responsive ── */
    @media (max-width: 540px) {
      .topbar { padding: 14px 18px; }
      .org-tagline { display: none; }
      .main { padding: 28px 14px 52px; }
      .form-card { border-radius: 12px; }
      .form-card iframe { height: 820px; }
      .trust { gap: 16px; }
    }
  </style>
</head>
<body>

  <div class="shell">

    <!-- Gold strip -->
    <div class="top-strip"></div>

    <!-- Header -->
    <header class="topbar">
      <a href="../index.html" class="back-link">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 3L5 8l5 5"/>
        </svg>
        Back
      </a>
      <div class="org-brand">
        <div class="org-name">
          <span class="org-icon">🏢</span>
          New Hire Portal
        </div>
        <span class="org-tagline">Onboarding · Welcome to the Team</span>
      </div>
    </header>

    <!-- Main -->
    <main class="main">

      <!-- Hero -->
      <div class="hero">
        <span class="hero-eyebrow">Getting You Started</span>
        <h1>Welcome to the <em>Team.</em></h1>
        <div class="divider"></div>
        <p class="hero-sub" style="margin-top:14px;">
          Fill out the form below so we can get everything set up before your first day. All fields are required unless marked optional.
        </p>
      </div>

      <!-- GHL Form -->
      <div class="form-card">
        <iframe
          src="https://api.leadconnectorhq.com/widget/form/FA31PXS5lzRC3JxJVIza"
          style="width:100%;height:860px;border:none;display:block;"
          id="inline-FA31PXS5lzRC3JxJVIza"
          data-layout="{'id':'INLINE'}"
          data-trigger-type="alwaysShow"
          data-trigger-value=""
          data-activation-type="alwaysActivated"
          data-activation-value=""
          data-deactivation-type="neverDeactivate"
          data-deactivation-value=""
          data-form-name="New Hire Onboarding Form"
          data-height="519"
          data-layout-iframe-id="inline-FA31PXS5lzRC3JxJVIza"
          data-form-id="FA31PXS5lzRC3JxJVIza"
          title="New Hire Onboarding Form"
        ></iframe>
        <script src="https://link.msgsndr.com/js/form_embed.js"></script>
      </div>

      <!-- Trust signals -->
      <div class="trust">
        <div class="trust-item">
          <div class="trust-check">✓</div>
          Your data is secure
        </div>
        <div class="trust-item">
          <div class="trust-check">✓</div>
          HR access only
        </div>
        <div class="trust-item">
          <div class="trust-check">✓</div>
          Takes under 2 minutes
        </div>
      </div>

    </main>

  </div>

</body>
</html>
