<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book an Appointment — Meridian Health Clinic</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f8fafc;
      --primary:  #0077b6;
      --teal:     #00b4a6;
      --text:     #1a1a2e;
      --muted:    #64748b;
      --card:     #ffffff;
      --border:   #e2e8f0;
      --shadow:   0 4px 24px rgba(0, 0, 0, 0.08);
    }

    html, body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* ── Fade in ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Page shell ── */
    .shell {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.5s ease both;
    }

    /* ── Blue accent strip ── */
    .top-strip {
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--primary), var(--teal));
      flex-shrink: 0;
    }

    /* ── Header ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 40px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      box-shadow: 0 1px 6px rgba(0,0,0,0.05);
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--muted);
      font-size: 0.84rem;
      letter-spacing: 0.02em;
      transition: color 0.2s ease;
    }
    .back-link:hover { color: var(--primary); }
    .back-link svg { width: 15px; height: 15px; flex-shrink: 0; }

    .clinic-brand {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .clinic-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.03em;
    }
    .clinic-icon { font-size: 1.15rem; }
    .clinic-tagline {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 56px;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      margin-bottom: 28px;
      animation: fadeIn 0.5s 0.1s ease both;
    }
    .hero h1 {
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      font-weight: 800;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 8px;
    }
    .hero h1 span { color: var(--primary); }
    .hero-sub {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .hero-sub em {
      font-style: normal;
      color: var(--teal);
      font-weight: 600;
    }

    /* ── Form card ── */
    .form-card {
      width: 100%;
      max-width: 620px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
      animation: fadeIn 0.5s 0.18s ease both;
    }

    .form-card iframe {
      display: block;
      width: 100%;
      height: 860px;
      border: none;
    }

    /* ── Trust signals ── */
    .trust {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 24px;
      animation: fadeIn 0.5s 0.28s ease both;
    }
    .trust-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .trust-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--teal);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ── Responsive ── */
    @media (max-width: 540px) {
      .topbar { padding: 14px 18px; }
      .clinic-tagline { display: none; }
      .main { padding: 28px 14px 48px; }
      .form-card { border-radius: 12px; }
      .form-card iframe { height: 820px; }
      .trust { gap: 16px; }
    }
  </style>
</head>
<body>

  <div class="shell">

    <!-- Accent strip -->
    <div class="top-strip"></div>

    <!-- Header -->
    <header class="topbar">
      <a href="../index.html" class="back-link">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 3L5 8l5 5"/>
        </svg>
        Back
      </a>
      <div class="clinic-brand">
        <div class="clinic-name">
          <span class="clinic-icon">🏥</span>
          Meridian Health Clinic
        </div>
        <span class="clinic-tagline">Trusted Care, Simplified Booking</span>
      </div>
    </header>

    <!-- Main -->
    <main class="main">

      <!-- Hero -->
      <div class="hero">
        <h1>Book Your <span>Appointment</span></h1>
        <p class="hero-sub">Fast <em>·</em> Simple <em>·</em> Confirmed Instantly</p>
      </div>

      <!-- GHL Form -->
      <div class="form-card">
        <iframe
          src="https://api.leadconnectorhq.com/widget/form/Ubv0CagTzdsUJD5yiMz7"
          style="width:100%;height:860px;border:none;display:block;"
          id="inline-Ubv0CagTzdsUJD5yiMz7"
          data-layout="{'id':'INLINE'}"
          data-trigger-type="alwaysShow"
          data-trigger-value=""
          data-activation-type="alwaysActivated"
          data-activation-value=""
          data-deactivation-type="neverDeactivate"
          data-deactivation-value=""
          data-form-name="Doctor - Patient Booking"
          data-height="700"
          data-layout-iframe-id="inline-Ubv0CagTzdsUJD5yiMz7"
          data-form-id="Ubv0CagTzdsUJD5yiMz7"
          title="Doctor - Patient Booking"
        ></iframe>
        <script src="https://link.msgsndr.com/js/form_embed.js"></script>
      </div>

      <!-- Trust signals -->
      <div class="trust">
        <div class="trust-item">
          <div class="trust-check">✓</div>
          Confirmed within seconds
        </div>
        <div class="trust-item">
          <div class="trust-check">✓</div>
          Secure &amp; Private
        </div>
        <div class="trust-item">
          <div class="trust-check">✓</div>
          No spam ever
        </div>
      </div>

    </main>

  </div>

</body>
</html>
